# Only GitHub Actions (.github/workflows/*.yml) are configured here.
# Python tools use the standard library only (no pip manifest), and Meson
# wraps, the Fortran code, and the NVIDIA HPC SDK version are not supported
# by Dependabot.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
