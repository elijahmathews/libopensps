name: Feature request
description: A new physical model, library, API capability, or performance improvement
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and use case
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Physics or API details
      description: Literature references, equations, and legacy FSPS equivalents; or the rough interface/workflow for API or build changes.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: willing-to-contribute
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes"
        - "Yes, with guidance"
        - "No"
